# Sidekiq-Cron schedule, loaded when Sidekiq starts (sidekiq-cron reads config/schedule.yml).
# Deere portal sync: get the order file from the supplier portal and upload it (SecurePortalSyncJob).
secure_portal_sync:
  cron: "0 8 * * * Asia/Kolkata"
  class: "SecurePortalSyncJob"
  queue: "default"
  active_job: true
  description: "Deere portal: order file to upload, at 08:00 IST"
# Expired cache files (Cache::CleanupJob).
cache_cleanup:
  cron: "30 2 * * * Asia/Kolkata"
  class: "Cache::CleanupJob"
  queue: "default"
  active_job: true
  description: "Delete expired cache files, at 02:30 IST"
